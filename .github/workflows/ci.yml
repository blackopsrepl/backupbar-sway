name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq qt6-declarative-dev-tools
          if ! command -v qmllint >/dev/null 2>&1; then
            qml_lint_path="$(find /usr -type f -name qmllint -print -quit)"
            test -n "$qml_lint_path"
            sudo ln -s "$qml_lint_path" /usr/local/bin/qmllint
          fi

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Run project checks
        run: make check
